name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Gradle build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          # Fabric Loom 1.7 is incompatible with Gradle 9; match the wrapper version
          gradle-version: 8.10.2

      - name: Build
        run: bash ./gradlew build --console=plain --no-daemon
